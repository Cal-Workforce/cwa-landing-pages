<text x="122" y="400" font-size="20" font-weight="600" fill="#B85A34" text-anchor="start" letter-spacing="4">A PROGRAM OF THE CALIFORNIA WORKFORCE ASSOCIATION</text>
<text x="120" font-size="76" font-weight="800" fill="#1C375D" letter-spacing="-1.5"><tspan x="120" y="480">Introducing the <tspan fill="#E17950">next</tspan></tspan><tspan x="120" y="560"><tspan fill="#E17950">chapter</tspan> in workforce</tspan><tspan x="120" y="640">leadership development.</tspan></text>
<text x="122" font-size="27" font-weight="400" fill="#3B5578"><tspan x="122" y="730">A nine-month, cohort-based fellowship for California's new and</tspan><tspan x="122" y="768">established workforce executives — governance, systems leadership,</tspan><tspan x="122" y="806">and a peer network that lasts a career.</tspan></text>
<rect x="122" y="856" width="70" height="3" fill="#E17950"/>
<text x="122" y="900" font-size="22" font-weight="600" fill="#1C375D" letter-spacing="0.3">Nine-Month Program<tspan fill="#E17950" font-weight="700">   ·   </tspan>Cohort of ~20 Fellows<tspan fill="#E17950" font-weight="700">   ·   </tspan>Led by Adam Peck &amp; Tim Aldinger</text>
<text x="1550.0" y="375" font-size="22" font-weight="600" fill="#F3E7DD" text-anchor="middle" letter-spacing="5">SCAN TO APPLY</text>
