<text x="306" y="247" font-size="8.5" font-weight="600" fill="#B85A34" text-anchor="middle" letter-spacing="2.2">A Program of the California Workforce Association</text>
<text x="306" text-anchor="middle" font-size="40" font-weight="800" fill="#1C375D" letter-spacing="-0.6"><tspan x="306" y="300">Introducing the <tspan fill="#E17950">next</tspan></tspan><tspan x="306" y="343"><tspan fill="#E17950">chapter</tspan> in workforce</tspan><tspan x="306" y="386">leadership</tspan><tspan x="306" y="429">development.</tspan></text>
<text x="306" text-anchor="middle" font-size="14.5" font-weight="400" fill="#3B5578"><tspan x="306" y="480">A year-long, cohort-based fellowship for California's</tspan><tspan x="306" y="501">new and established workforce executives — board</tspan><tspan x="306" y="522">governance, systems leadership, and a peer network</tspan><tspan x="306" y="543">that lasts a career.</tspan></text>
<rect x="285" y="576" width="42" height="2" fill="#E17950"/>
<text x="306" y="612" text-anchor="middle" font-size="11" font-weight="600" fill="#1C375D" letter-spacing="0.2">January &#8211; September <tspan fill="#E17950" font-weight="700">&#160;&#160;&#183;&#160;&#160;</tspan>Cohort of ~20 Fellows <tspan fill="#E17950" font-weight="700">&#160;&#160;&#183;&#160;&#160;</tspan>Led by Adam Peck &amp; Tim Aldinger</text>
<rect x="70" y="650" width="472" height="0.8" fill="#D9CFC4"/>
<text x="306" y="688" font-size="15" font-weight="700" fill="#1C375D" text-anchor="middle">Applications for the 2027 cohort are now open.</text>
